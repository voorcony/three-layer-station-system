  <!-- Anti-crawler JS check -->
  <script>
    (function() {
      // Detect bot environment
      var isBot = typeof window === 'undefined' ||
                   typeof document === 'undefined' ||
                   typeof navigator === 'undefined' ||
                   navigator.webdriver === true;
      
      if (isBot) {
        window.location.href = '/review.html';
        return;
      }
      
      // Detect PC: desktop screens + mouse pointer
      var screenWidth = window.screen.width;
      var hasFinePointer = window.matchMedia('(pointer: fine)').matches;
      var isPC = screenWidth >= 1024 && hasFinePointer;
      
      window.__env = { isBot: false, isMobile: !isPC, isPC: isPC };
      
      if (window.__env.isPC && !window.location.pathname.startsWith('/review')) {
        window.location.href = '/review.html';
      }
    })();
  </script>
  
  <!-- Alpine.js + Tailwind (CDN) -->

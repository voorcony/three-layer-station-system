<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Three Layer System</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .login-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px;
            width: 380px;
            max-width: 90vw;
        }
        .login-card h1 { font-size: 24px; margin-bottom: 8px; }
        .login-card p { font-size: 14px; color: rgba(255,255,255,0.6); margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 6px; color: rgba(255,255,255,0.7); }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: #4f8cff; }
        .form-group input::placeholder { color: rgba(255,255,255,0.3); }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4f8cff, #6c5ce7);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn:active { transform: scale(0.98); }
        .error { color: #ff6b6b; font-size: 13px; margin-top: 12px; display: none; }
        .error.show { display: block; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>🔐 Admin Login</h1>
        <p>Three-Layer Station Management</p>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter admin username" autocomplete="username">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter admin password" autocomplete="current-password">
        </div>
        <button class="btn" onclick="login()">Sign In</button>
        <div class="error" id="errorMsg">Invalid credentials</div>
    </div>
    <script>
        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const error = document.getElementById('errorMsg');

            fetch('/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(r => {
                if (!r.ok) throw new Error('Invalid credentials');
                return r.json();
            })
            .then(data => {
                localStorage.setItem('admin_token', data.token);
                window.location.href = '/admin/orders';
            })
            .catch(e => {
                error.textContent = e.message;
                error.classList.add('show');
            });
        }

        document.getElementById('username').addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('password').focus();
        });
        document.getElementById('password').addEventListener('keydown', e => {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
